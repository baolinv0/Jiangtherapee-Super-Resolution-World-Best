[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jsr-engineering-reproduction"
version = "0.1.0"
description = "Independent, explicitly scoped engineering reproduction of the public JSR core"
requires-python = ">=3.10"
dependencies = ["torch>=2.2,<3", "numpy>=1.24,<3", "Pillow>=10,<13", "PyYAML>=6,<7"]

[project.optional-dependencies]
test = ["pytest>=8,<10", "opencv-python-headless>=4.9,<5"]
raw = ["rawpy>=0.21,<0.27"]

[tool.setuptools.packages.find]
where = ["reproduction"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["reproduction"]
