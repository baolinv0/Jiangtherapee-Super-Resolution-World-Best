# Independent public-data/physics reconstruction, NOT author training settings.
seed: 1234
threads: 4
device: cuda
output: runs/spectral-k7
model:
  width: 32
  heads: 4
  window: 4
  frames: 7
  scale: 2
data:
  manifest: data/train/manifest.jsonl
  profile: null  # Replace with measured PTC fit JSON when available.
  options:
    protocol: spectral-camera-v2
    native_size: 64
    frames: 7
    scale: 2
    samples_per_scene: 16
    max_shift: 2.0
    scene_gain: [0.125, 8.0]  # log-uniform; targets may exceed reference white.
    bracket_interval_ev: [0.0, 1.0]
    camera_ids: [Canon 5DMarkII, Nikon D3X, Nikon D3, Nikon D700]
    iso: [100, 200, 400, 800]
    f_number: [2.0, 8.0]
    pitch_um: [3.0, 5.76]
    fill_factor: [0.9, 1.0]
    defocus_nm: [-20.0, 20.0]
    astigmatism_nm: [0.0, 60.0]
    coma_nm: [0.0, 80.0]
    lca_native: [0.0, 0.5]
    field_extent: 0.1
    psf_radius: 16
    scene_margin_hr: 32
    pupil_samples: 64
    fft_size: 256
    augment: true
    noise: true
    quantize: true
train:
  steps: 100000
  batch_size: 1
  lr: 0.0002
  weight_decay: 0.0001
  validate_every: 1000
  crop_border: 8
  clip_grad: 1.0
  highlight_weight: 0.2
