    <text style="font-size: 11px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #172c42" x="690.3" y="191.171312" transform="rotate(-0 690.3 191.171312)">Legacy RGB [B,3,H,W]</text>
   </g>
   <g id="text_4">
    <text style="font-size: 10.5px; font-family: 'DejaVu Sans'; fill: #172c42" transform="translate(135.560297 275.645531)">144 + RGB3 + structure3 + noise1</text>
    <text style="font-size: 10.5px; font-family: 'DejaVu Sans'; fill: #172c42" transform="translate(143.111273 289.853344)">local-amplitude canonicalization</text>
    <text style="font-size: 10.5px; font-family: 'DejaVu Sans'; fill: #172c42" transform="translate(133.998422 305.477836)">frozen mean/std affine (302 values)</text>
   </g>
   <g id="text_5">
    <text style="font-size: 11px; font-family: 'DejaVu Sans'; fill: #172c42" transform="translate(158.451859 382.743313)">Controller: depth-3 U-Net</text>
    <text style="font-size: 11px; font-family: 'DejaVu Sans'; fill: #172c42" transform="translate(173.953266 399.758938)">151 -&gt; 36 channels</text>
    <text style="font-size: 11px; font-family: 'DejaVu Sans'; fill: #172c42" transform="translate(139.951234 414.643313)">1,990,660 trainable parameters</text>
   </g>
   <g id="text_6">
    <text style="font-size: 10.5px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #172c42" x="690.3" y="290.457914" transform="rotate(-0 690.3 290.457914)">Same RAW / flow / covariance</text>
   </g>
   <g id="text_7">
    <text style="font-size: 10.5px; font-family: 'DejaVu Sans'; fill: #172c42" transform="translate(611.638594 384.347531)">Continuous RAW kernel fusion</text>
    <text style="font-size: 10.5px; font-family: 'DejaVu Sans'; fill: #172c42" transform="translate(623.535586 398.555344)">12 coefficients per colour</text>
    <text style="font-size: 10.5px; font-family: 'DejaVu Sans'; fill: #172c42" transform="translate(613.549102 413.780344)">exp(-z/2 + 5*tanh(q.basis/5))</text>
   </g>
   <g id="text_8">
    <text style="font-size: 11px; font-family: 'DejaVu Sans'; fill: #172c42" transform="translate(333.279219 499.420313)">Shared radial LCA on learned + legacy (optional)</text>
